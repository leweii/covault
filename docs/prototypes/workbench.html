<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>Covault Workbench — prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* Approximates Obsidian's default theme variables so the prototype reads
   like the real plugin view. In the plugin these come from the theme. */
:root { --tree-w: 330px; --insp-w: 320px; --tl-w: 340px; }
:root[data-theme="dark"] {
  --bg: #1e1e1e; --bg-2: #262626; --bg-3: #2f2f2f; --border: #363636; --hover: rgba(255,255,255,.06);
  --text: #dadada; --muted: #a3a3a3; --faint: #6f6f6f; --accent: #8a5cf5; --accent-hover: #9d76f7; --on-accent: #fff;
  --green: #44cf6e; --red: #fb464c; --yellow: #e0ac00; --blue: #3a9fff; --orange: #e9973f;
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-2: #f6f6f6; --bg-3: #ececec; --border: #e0e0e0; --hover: rgba(0,0,0,.05);
  --text: #222; --muted: #5c5c5c; --faint: #9a9a9a; --accent: #7c3aed; --accent-hover: #6d28d9; --on-accent: #fff;
  --green: #08b94e; --red: #e93147; --yellow: #c48b00; --blue: #086ddd; --orange: #d27b10;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; cursor: pointer; }
.icon { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ── Fake Obsidian chrome (tab strip) ─────────────────────── */
.chrome { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; background: var(--bg-2); border-bottom: 1px solid var(--border); font-size: 12.5px; color: var(--muted); }
.chrome .tab { display: flex; align-items: center; gap: 6px; padding: 5px 12px; background: var(--bg); border: 1px solid var(--border); border-bottom: none; border-radius: 6px 6px 0 0; color: var(--text); margin-top: 6px; }
.chrome .spacer { flex: 1; }
.chrome .proto { font-size: 11.5px; color: var(--faint); }
.chrome button { background: var(--bg-3); border: 1px solid var(--border); border-radius: 5px; padding: 2px 8px; font-size: 11.5px; }

/* ── Workbench layout ─────────────────────────────────────── */
.wb { flex: 1; display: grid; grid-template-rows: auto 1fr; min-height: 0; }

/* Top status bar */
.top { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 22px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.chrome .tab .mini { display: inline-flex; align-items: center; gap: 5px; margin-left: 6px; font-size: 11.5px; color: var(--muted); }
.chrome .tab .mini .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
.chrome .tab .mini.is-conflict .dot { background: var(--yellow); }
.chrome .tab .mini.is-error .dot { background: var(--red); }
.chrome .tab .mini.is-syncing .dot { background: var(--blue); animation: pulse 1s infinite; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-size: 17px; margin: 0; font-weight: 650; }
.state-pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--bg-3); }
.state-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.state-pill.is-conflict .dot { background: var(--yellow); }
.state-pill.is-syncing .dot { background: var(--blue); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes spin { to { transform: rotate(360deg); } }

.kpis { display: flex; gap: 10px; justify-content: flex-start; flex-wrap: wrap; }
.kpi { display: flex; align-items: center; gap: 9px; padding: 7px 12px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg-2); min-width: 128px; cursor: pointer; }
.kpi:hover { background: var(--hover); }
.kpi .n { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.kpi.red .n { color: var(--red); } .kpi.orange .n { color: var(--orange); } .kpi.blue .n { color: var(--blue); } .kpi.green .n { color: var(--green); }

.countdown { display: flex; align-items: center; gap: 12px; }
.ring { position: relative; width: 52px; height: 52px; }
.ring svg { width: 52px; height: 52px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 4; }
.ring .track { stroke: var(--bg-3); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.ring .t { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
.ring.is-syncing .prog { stroke: var(--blue); stroke-dasharray: 40 200 !important; animation: spin 1s linear infinite; transform-origin: center; transition: none; }
.cd-text .big { font-weight: 650; }
.cd-text .small { font-size: 11.5px; color: var(--muted); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg-3); font-size: 13px; }
.btn:hover { background: var(--hover); }
.btn.cta { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.cta:hover { background: var(--accent-hover); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }

/* Body: tree | main | inspector */
.body { display: grid; grid-template-columns: var(--tree-w) 1fr auto; min-height: 0; position: relative; }
/* Drag handles on panel edges — a 6px hit area, a 2px accent line on hover. */
.resizer { position: absolute; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 4; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 2px; width: 2px; background: transparent; transition: background .1s; }
.resizer:hover::after, .resizer.dragging::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }
.col { position: relative; }
.col { min-height: 0; display: flex; flex-direction: column; }
.col + .col { border-left: 1px solid var(--border); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; }
.col-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; font-weight: 650; flex: 1; }

/* ── Tree ─────────────────────────────────────────────────── */
.search { margin: 0 14px 8px; display: flex; align-items: center; gap: 6px; padding: 5px 9px; border: 1px solid var(--border); border-radius: 7px; background: var(--bg-2); color: var(--faint); }
.search input { flex: 1; border: none; background: none; outline: none; color: var(--text); font: inherit; font-size: 13px; }
.chips { display: flex; gap: 5px; padding: 0 14px 8px; flex-wrap: wrap; }
.chip { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--border); background: none; font-size: 12px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.chip .c { opacity: .75; margin-left: 3px; }
.tree { flex: 1; overflow: auto; padding: 0 6px 12px; font-size: 13px; }
.node { display: flex; align-items: center; gap: 5px; padding: 3px 6px; border-radius: 5px; cursor: pointer; white-space: nowrap; }
.node:hover { background: var(--hover); }
.node.sel { background: color-mix(in srgb, var(--accent) 22%, transparent); }
.node .tw { width: 14px; color: var(--faint); display: inline-flex; justify-content: center; flex: 0 0 14px; }
.node .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.node.lib > .name { font-weight: 650; }
.node.lib { margin-top: 6px; }
.node .meta { font-size: 11px; color: var(--faint); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 17px; padding: 0 5px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
.badge.conflict { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
.badge.local { background: color-mix(in srgb, var(--orange) 20%, transparent); color: var(--orange); }
.badge.incoming { background: color-mix(in srgb, var(--blue) 20%, transparent); color: var(--blue); }
.st { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: 0 0 16px; border-radius: 50%; font-size: 10px; font-weight: 800; }
.st.synced { color: var(--green); }
.st.local { color: var(--orange); }
.st.pending { color: var(--orange); }
.st.incoming { color: var(--blue); }
.st.conflict { color: var(--red); }
.dtag { flex: 0 0 auto; font-size: 10.5px; line-height: 1.5; padding: 0 6px; border-radius: 4px; font-weight: 600; }
.dtag.s-draft { background: var(--bg-3); color: var(--muted); }
.dtag.s-review { background: color-mix(in srgb, var(--yellow) 18%, transparent); color: var(--yellow); }
.dtag.s-approved { background: color-mix(in srgb, var(--green) 16%, transparent); color: var(--green); }
.dtag.s-outdated { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.chips .lbl { font-size: 11.5px; color: var(--faint); align-self: center; margin-right: 2px; }
.docstatus { margin: 12px 0; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg-2); }
.docstatus .h { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.docstatus .opts { display: flex; gap: 5px; flex-wrap: wrap; }
.docstatus .opts button { border: 1px solid var(--border); background: none; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.docstatus .opts button.on { border-color: transparent; }
.docstatus .by { font-size: 11.5px; color: var(--faint); margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 8px 14px 12px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }

/* ── Main column ──────────────────────────────────────────── */
.main { overflow: auto; padding: 4px 18px 18px; }
.card { border: 1px solid var(--border); border-radius: 10px; background: var(--bg-2); margin-top: 12px; }
.card-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.card-head h3 { margin: 0; font-size: 13.5px; flex: 1; }
.card.conflicts { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.card.conflicts .card-head { background: color-mix(in srgb, var(--red) 8%, transparent); border-radius: 10px 10px 0 0; }
.crow { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-top: 1px solid var(--border); }
.crow:first-of-type { border-top: none; }
.crow .path { flex: 1; min-width: 0; }
.crow.is-sel { background: color-mix(in srgb, var(--accent) 10%, transparent); }
.flink { color: inherit; cursor: pointer; text-decoration: none; border-bottom: 1px dashed transparent; }
.flink:hover { color: var(--accent); border-bottom-color: currentColor; }
.files .flink { color: var(--muted); }
.files .flink:hover { color: var(--accent); }
.crow .path b { font-weight: 600; }
.crow .path .sub { font-size: 12px; color: var(--muted); }

/* Libraries strip */
.libs-wrap { margin-top: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-2); }
.libs-head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; }
.libs-head:hover { background: var(--hover); border-radius: 10px; }
.libs-head h3 { margin: 0; font-size: 13px; }
.libs-head .sum { flex: 1; font-size: 12px; color: var(--muted); }
.libs-head .tog { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
/* Collapsed: one line of name pills, scrolls sideways; a fade says there's more. */
.libs-strip { position: relative; padding: 0 12px 10px; }
.libs-strip .row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 4px; }
.libs-strip::after { content: ""; position: absolute; right: 12px; top: 0; bottom: 14px; width: 48px; background: linear-gradient(to right, transparent, var(--bg-2)); pointer-events: none; }
.lpill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg); font-size: 12.5px; white-space: nowrap; cursor: pointer; flex: 0 0 auto; }
.lpill:hover { background: var(--hover); }
.lpill.error { border-color: color-mix(in srgb, var(--red) 55%, var(--border)); }
.libs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 0 12px 12px; }
.lib-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.lib-card .row1 { display: flex; align-items: center; gap: 7px; }
.lib-card .row1 .nm { font-weight: 650; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-card .row2 { font-size: 12px; color: var(--muted); margin-top: 4px; }
.lib-card .row3 { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.sdot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex: 0 0 8px; }
.sdot.conflict { background: var(--yellow); } .sdot.syncing { background: var(--blue); animation: pulse 1s infinite; } .sdot.error { background: var(--red); }

/* Tabs + logs */
.tabs { display: flex; gap: 2px; padding: 4px 10px 0; border-bottom: 1px solid var(--border); }
.tabs button { background: none; border: none; padding: 8px 12px; font-size: 13px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tabs .count { font-size: 11px; color: var(--faint); margin-left: 4px; }
.log { padding: 4px 0; }
.entry { padding: 8px 14px; border-top: 1px solid var(--border); }
.entry:first-child { border-top: none; }
.entry .l1 { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.entry .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; width: 92px; flex: 0 0 92px; }
.entry .lib { font-weight: 600; }
.entry .sum { color: var(--muted); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.entry .dur { font-size: 11.5px; color: var(--faint); }
.tag { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--bg-3); color: var(--muted); }
.tag.ok { color: var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
.tag.err { color: var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); }
.tag.skip { color: var(--yellow); background: color-mix(in srgb, var(--yellow) 14%, transparent); }
.tag.run { color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
.files { margin: 6px 0 2px 100px; font-size: 12.5px; }
.files div { display: flex; gap: 6px; padding: 1px 0; color: var(--muted); }
.files .ar { width: 14px; font-weight: 800; }
.files .ar.up { color: var(--orange); } .files .ar.down { color: var(--blue); }
.files .k { width: 14px; color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.files .who { color: var(--faint); }

.job { border-top: 1px solid var(--border); }
.job:first-child { border-top: none; }
.job .jh { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
.job .jh:hover { background: var(--hover); }
.job .jn { font-weight: 600; }
.job .js { font-size: 12px; color: var(--muted); }
.job .jinfo { flex: 1; min-width: 0; }
.job .jnext { text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.job .jnext b { color: var(--text); font-weight: 600; }
.jbody { padding: 0 14px 12px 40px; }
.jedit { margin: 0 14px 12px 40px; padding: 12px 14px; border: 1px solid var(--accent); border-radius: 10px; background: var(--bg); display: grid; gap: 10px; }
.jedit label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.jedit input[type=text], .jedit input[type=number], .jedit input[type=time], .jedit textarea { font: inherit; font-size: 13px; color: var(--text); background: var(--bg-2); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; }
.jedit textarea { min-height: 84px; resize: vertical; line-height: 1.5; }
.jedit .schedrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--text); }
.jedit .schedrow input[type=number] { width: 64px; }
.jedit .foot { display: flex; align-items: center; gap: 8px; }
.jedit .foot .grow { flex: 1; font-size: 12px; }
.jedit .foot .grow a { color: var(--accent); text-decoration: none; }
.btn.danger-text { color: var(--red); }
.run { padding: 6px 0; border-top: 1px dashed var(--border); font-size: 12.5px; }
.run:first-child { border-top: none; }
.run .rl { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.run .rt { color: var(--muted); font-variant-numeric: tabular-nums; }
.run .report { margin: 6px 0 2px; padding: 8px 10px; border-left: 2px solid var(--border); color: var(--text); background: var(--bg); border-radius: 0 6px 6px 0; }
.run .report a { color: var(--accent); text-decoration: none; margin-right: 8px; }
.spin { animation: spin 1s linear infinite; }

/* ── Inspector ────────────────────────────────────────────── */
.insp { width: 0; overflow: hidden; transition: width .18s ease; background: var(--bg); }
.insp.open { width: var(--insp-w); }
body.resizing .insp { transition: none; }
.insp-inner { width: var(--insp-w); overflow: auto; height: 100%; }
.ix-head { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 14px 18px 12px; border-bottom: 1px solid var(--border); }
.ix-top { display: flex; align-items: flex-start; gap: 10px; }
.ix-fileicon { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 34px; background: var(--bg-3); color: var(--muted); }
.ix-fileicon .icon { width: 17px; height: 17px; }
.ix-title { flex: 1; min-width: 0; }
.ix-title h4 { margin: 0; font-size: 15px; line-height: 1.3; word-break: break-word; }
.ix-crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-top: 3px; font-size: 11.5px; color: var(--faint); }
.ix-crumb .lib { color: var(--muted); font-weight: 600; }
.ix-close { background: none; border: none; color: var(--faint); padding: 4px; border-radius: 6px; }
.ix-close:hover { background: var(--hover); color: var(--text); }
.ix-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.ix-actions .btn { white-space: nowrap; }
.ix-actions .btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.ix-body { padding: 4px 18px 22px; }
.ix-sec { padding: 14px 0 0; }
.ix-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ix-label .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 11.5px; }
/* Sync status card with a coloured edge */
.ix-sync { position: relative; padding: 12px 14px 12px 16px; border-radius: 10px; background: var(--bg-2); overflow: hidden; }
.ix-sync::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--green)); }
.ix-sync .t { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 13.5px; }
.ix-sync .t .st { background: color-mix(in srgb, var(--c) 18%, transparent); }
.ix-sync .d { font-size: 12.5px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.track { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 14px; }
.tk { position: relative; text-align: center; font-size: 10.5px; color: var(--faint); padding-top: 16px; }
.tk::before { content: ""; position: absolute; top: 3px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--bg); box-shadow: 0 0 0 2px var(--border); z-index: 1; }
.tk::after { content: ""; position: absolute; top: 6px; left: 50%; width: 100%; height: 2px; background: var(--border); }
.tk:last-child::after { display: none; }
.tk.done { color: var(--muted); } .tk.done::before { background: var(--green); box-shadow: 0 0 0 2px var(--green); } .tk.done::after { background: var(--green); }
.tk.warn { color: var(--orange); } .tk.warn::before { background: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 35%, transparent); }
.tk.bad { color: var(--red); } .tk.bad::before { background: var(--red); box-shadow: 0 0 0 3px color-mix(in srgb, var(--red) 35%, transparent); }
/* Document status: one segmented row */
.ds-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; border-radius: 9px; background: var(--bg-2); }
.ds-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; padding: 5px 4px; border: none; border-radius: 6px; background: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.ds-seg button:hover { background: var(--hover); color: var(--text); }
.ds-seg button i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: 0 0 7px; }
.ds-seg button.on { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.25), inset 0 0 0 1px color-mix(in srgb, var(--c) 55%, transparent); }
.ds-by { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--faint); margin-top: 7px; }

  const out = [];

    if (typeof v === "string") out.push({ lib, rel: p, path: lib.path ? `${lib.path}/${p}` : p, status: v });

const syncMatches = (status) => filter === "all" || status === filter || (filter === "local" && status === "pending");

function agg(lib, node, prefix) {

// Line diff (LCS) between two versions, collapsed to changes ± 2 lines.
function diffLines(a, b, full = false) {
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && A[i] === B[j]) { out.push(["ctx", A[i]]); i++; j++; }
    else if (i < n && (j >= m || L[i + 1][j] >= L[i][j + 1])) { out.push(["del", A[i]]); i++; }
    else { out.push(["add", B[j]]); j++; }
  }
  if (full) return out;
  const keep = out.map((o, k) => o[0] !== "ctx" || out.slice(Math.max(0, k - 2), k + 3).some((x) => x[0] !== "ctx"));
  const res = []; let gap = false;
  out.forEach((o, k) => { if (keep[k]) { res.push(o); gap = false; } else if (!gap) { res.push(["gap", "⋯"]); gap = true; } });
  return res;

// Each side panel has a drag handle on its inner edge. Widths persist

const PANELS = {

  if (saved) document.documentElement.style.setProperty(p.v, saved + "px");
}
document.addEventListener("pointerdown", (e) => {
  const h = e.target.closest("[data-resize]");
  if (!h) return;
  const p = PANELS[h.dataset.resize];
  const start = e.clientX;
  const startW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue(p.v));
  h.classList.add("dragging"); document.body.classList.add("resizing");
  const move = (ev) => {
    const w = Math.min(p.max, Math.max(p.min, startW + p.dir * (ev.clientX - start)));
    document.documentElement.style.setProperty(p.v, w + "px");
  };
  const up = () => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    h.classList.remove("dragging"); document.body.classList.remove("resizing");
    localStorage.setItem(`covault-${h.dataset.resize}-w`, parseFloat(getComputedStyle(document.documentElement).getPropertyValue(p.v)));
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  e.preventDefault();
});

function runSync(trigger) {
  if (syncing) return;
  syncing = true; libraries.forEach((l) => { l.syncing = true; });
  renderAll();
  setTimeout(() => {
    syncing = false;
    // Local edits get shared; the failing library is still failing.
    const shared = [];
    for (const lib of libraries) {
      lib.syncing = false;
      if (!lib.error) lib.last = Date.now();
      for (const f of filesOf(lib)) if (f.status === "local" || f.status === "pending") { setStatus(lib, f.rel, "synced"); shared.push([lib.name, f.rel]); }
      lib.state = lib.error ? "error" : agg(lib, lib.tree, "").conflict ? "conflict" : "idle";
      if (lib.error) lib.attempts++;
    }
    if (libraries.some((l) => l.error)) syncLog.unshift({ at: Date.now(), lib: "team-ccp-kb", trigger, summary: "failed — couldn't reach GitHub (proxy refused the connection)", ms: 30000, status: "error", down: [], up: [] });
    if (shared.length) syncLog.unshift({ at: Date.now(), lib: shared[0][0], trigger, summary: `saved ${shared.length} change(s), shared yours`, ms: 3900, status: "ok", down: [], up: shared.map(([, p]) => ["M", p]) });
    openEntries.clear(); openEntries.add(0);
    nextSyncAt = Date.now() + SYNC_INTERVAL;
    renderAll(); toast("Sync finished");
  }, 3000);
}
/** Retry one library. In the mock the retry succeeds, so the alert goes —
 *  only after the library actually synced, never when the retry starts. */
function retryLibrary(name) {
  const lib = libraries.find((l) => l.name === name);
  if (!lib || lib.syncing) return;
  lib.syncing = true; renderAll();
  setTimeout(() => {
    lib.syncing = false; lib.error = null; lib.attempts = 0; lib.last = Date.now();
    lib.state = agg(lib, lib.tree, "").conflict ? "conflict" : "idle";
    syncLog.unshift({ at: Date.now(), lib: lib.name, trigger: "manual", summary: "synced after retry — got teammates' updates", ms: 2600, status: "ok", down: [["M", "SLA.md", "Nancy Liu"]], up: [] });
    openEntries.clear(); openEntries.add(0);
    renderAll(); toast(`${lib.name} is syncing again`);
  }, 2500);
}
function setStatus(lib, relPath, status) {
  const parts = relPath.split("/"); let node = lib.tree;
  for (const p of parts.slice(0, -1)) node = node[p];
  node[parts.at(-1)] = status;
}

  window.dispatchEvent(new PointerEvent("pointerup", {}));
  const w = getComputedStyle(document.documentElement).getPropertyValue("--tree-w").trim();
  const col = document.querySelector(".body > .col").getBoundingClientRect().width;
  document.title = `SELFTEST tree-w=${w} col=${col} saved=${localStorage.getItem("covault-tree-w")}`;
  localStorage.clear();
}
if (params.get("selftest") === "tm") {
  // Simulates ticking boxes: open history, What changed, tick v2 then v4, then untick v4.
  openTimeMachine("teams/team-cookbook-kb/01_doc/02_domain/过敏原标注.md");
  document.querySelector('[data-mode="diff"]').click();
  const tick = (k) => document.querySelector(`[data-ver="${k}"] .vcheck`).dispatchEvent(new MouseEvent("click", { bubbles: true }));
  const log = [];
  tick(2); log.push(`${tm.lo}-${tm.hi}`);
  tick(4); log.push(`${tm.lo}-${tm.hi}`);
  tick(4); log.push(`${tm.lo}-${tm.hi}`);
  document.querySelector('[data-ver="1"] .vm').dispatchEvent(new MouseEvent("click", { bubbles: true })); log.push(`${tm.lo}-${tm.hi}`);
  document.title = "SELFTEST " + log.join(" ");
}
if (params.get("selftest") === "sync") {
  const snap = (tag) => `${tag}: kpis=${document.querySelectorAll(".kpi").length} alert=${document.querySelectorAll("#failCard .alert").length}${document.querySelector("#failCard .alert.is-loading") ? "(loading)" : ""}`;
  const log = [snap("before")];
  runSync("manual"); log.push(snap("during"));
  setTimeout(() => {
    log.push(snap("after sync"));
    retryLibrary("team-ccp-kb"); log.push(snap("retrying"));
    setTimeout(() => { log.push(snap("after retry")); document.title = "SELFTEST " + log.join(" | "); }, 2700);
  }, 3200);
}
if (params.get("editjob")) { tab = "jobs"; editingJob = +params.get("editjob"); renderTabs(); }
if (params.get("midsync")) { syncing = true; libraries.forEach((l) => { l.syncing = true; }); renderAll(); }
if (params.get("libs") === "open") { libsOpen = true; renderLibs(); }
if (params.get("resolve")) openResolver(params.get("resolve"));
if (params.get("tm")) {
  const [lo, hi] = (params.get("range") || `${params.get("v") || 0}-${params.get("v") || 0}`).split("-").map(Number);
  tm = { path: selected, idx: lo, mode: params.get("tm"), lo, hi, anchor: lo }; renderTimeMachine();
}
setInterval(() => {
  renderCountdown();
  document.querySelectorAll("[data-until]").forEach((el) => el.textContent = until(+el.dataset.until));
}, 1000);
</script>
</body>
</html>
